<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Fiza ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<!-- Romantic Background -->
<div class="hearts"></div>
<div class="sparkles"></div>

<!-- Opening Screen -->
<section id="opening-screen">

<h1 class="main-title">
Happy Birthday
</h1>

<h2 class="name">
Fiza ❤️
</h2>

<p class="subtitle">
Today is not just your birthday...
It's the most beautiful day of my life too. 💖
</p>

<!-- Cake -->
<div class="cake">

<div class="candle">
<div class="flame"></div>
</div>

<div class="cake-top"></div>

<div class="cake-body"></div>

<div class="cake-base"></div>

</div>

<button id="cutCakeBtn">
🎂 Cut The Cake 🎂
</button>

<p class="tap">
Tap the button and make a wish 🌸
</p>

</section>

<!-- Balloons -->
<div id="balloons"></div>

<!-- Flowers -->
<div id="flowers"></div>

<!-- Confetti -->
<div id="confetti"></div>

<!-- Music -->
<audio id="birthdayMusic" loop>
<source src="osanam.mp3" type="audio/mpeg">
</audio>

<!-- Main Website -->
<div id="mainWebsite" style="display:none;">

<!-- Yahan se tumhara Page 1 shuru hoga -->

</div>

<script src="script.js"></script>

</body>
</html>
